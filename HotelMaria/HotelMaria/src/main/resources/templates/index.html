<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel da Maria</title>
  <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <img th:src="@{/img/logo-dark.png}" alt="Logo Hotel da Maria">
      <h1>Hotel da Maria</h1>
    </div>
  </header>

  <!-- Hóspedes VIP -->
  <section class="section dark">
    <h2>Hóspedes VIP +</h2>
    <div class="carousel">
      <button class="prev">&#10094;</button>
      <div class="carousel-track">
        <a th:href="@{/perfil-pet/{id}(id=${pet.id})}" style="text-decoration: none; color: inherit;" th:each="pet : ${pets}">
          <div class="card">
            <img th:src="${pet.fotoUrl}" th:alt="${'Foto de ' + pet.nome}">
            <p th:text="${pet.nome} + ' | ' + ${pet.idade} + ' anos'"></p>
          </div>
        </a>
      </div>
      <button class="next">&#10095;</button>
    </div>
  </section>

  <!-- Estrelas da casa -->
  <section class="section dark">
    <h2>Estrelas da casa</h2>
    <div class="carousel">
      <button class="prev">&#10094;</button>
      <div class="carousel-track">
        <div class="card"><img th:src="@{/img/alfie.png}" alt="">
          <p>Alfie | 3 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/dalila.png}" alt="">
          <p>Dalila | 9 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/raul.png}" alt="">
          <p>Raul | 5 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/gamora.png}" alt="">
          <p>Gamora | 2 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/sushi.png}" alt="">
          <p>Sushi | 2 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/alfie.png}" alt="">
          <p>Alfie | 3 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/alfie.png}" alt="">
          <p>Alfie | 3 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/dalila.png}" alt="">
          <p>Dalila | 9 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/raul.png}" alt="">
          <p>Raul | 5 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/gamora.png}" alt="">
          <p>Gamora | 2 anos</p>
        </div>
        <div class="card"><img th:src="@{/img/sushi.png}" alt="">
          <p>Sushi | 2 anos</p>
        </div>
      </div>
      <button class="next">&#10095;</button>
    </div>
  </section>

  <!-- Hóspedes mais animados -->
  <section class="section light">
    <h2>Hóspedes mais animados</h2>
    <div class="grid">
      <a th:href="@{/perfil-pet/{id}(id=${pet.id})}" style="text-decoration: none; color: inherit;" th:each="pet : ${disponiveis}">
        <div class="card adopt">
          <img th:src="${pet.fotoUrl}" th:alt="${'Foto de ' + pet.nome}">
          <p th:text="${pet.nome} + ' | ' + ${pet.idade} + ' anos | ' + ${pet.raca}"></p>
          <button onclick="return false;">adotar</button>
        </div>
      </a>
    </div>
  </section>

  <footer class="footer">
    <a th:href="@{/home}">
      <img th:src="@{/img/home-dark.png}" alt="Início">
    </a>
    <a th:href="@{/doar}">
      <img th:src="@{/img/doar.png}" alt="Doações">
    </a>
    <a th:href="@{/sobre}">
      <img th:src="@{/img/sobre-nos.png}" alt="Hóspedes">
    </a>
    <a th:href="@{/perfil}">
      <img th:src="@{/img/perfil.png}" alt="Perfil">
    </a>
  </footer>

  <script th:src="@{/js/script.js}"></script>
</body>

</html>
