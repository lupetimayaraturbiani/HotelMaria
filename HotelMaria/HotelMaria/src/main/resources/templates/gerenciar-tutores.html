<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Tutores</title>
    <link rel="stylesheet" th:href="@{/css/gerenciar-adocoes.css}">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <a th:href="@{/index-adm}" class="back">←</a>
            <h1>Gerenciar Tutores</h1>
        </div>
    </header>

    <main class="container">
        <div class="tabs">
            <button class="tab active">Aprovação pendente</button>
            <button class="tab">Outros</button>
        </div>

        <section class="solicitacoes">
            <div th:if="${tutores == null or #lists.isEmpty(tutores)}">
                <p>Nenhum tutor encontrado.</p>
            </div>

            <div th:each="tutor : ${tutores}" class="card">
                <img th:src="@{/img/foto.png}" th:alt="${tutor.nome}" class="pet-foto">
                <div class="info">
                    <h2 th:text="${tutor.nome}">Nome</h2>
                    <p><strong>E-mail:</strong> <span th:text="${tutor.email}">email</span></p>
                    <p><strong>Telefone:</strong> <span th:text="${tutor.telefone}">telefone</span></p>
                    <a th:href="@{'/usuarios/perfil'(id=${tutor.id})}" class="detalhes">Ver perfil</a>
                </div>
                <div class="acoes">
                    <a th:href="@{'/usuarios/deletar/' + ${tutor.id}}"><button class="reprovar">❌</button></a>
                </div>
            </div>

        </section>
    </main>
</body>

</html>
